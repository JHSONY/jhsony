<script>
// Minimal local D3-like shim (select/selectAll/attr/style/text/html/on/classed/append/data/enter/scaleSqrt/max/pointer).
// Covers only what this page uses, so the dashboard has zero external/network dependencies.
(function(){
  const SVGNS = "http://www.w3.org/2000/svg";
  const SVG_TAGS = new Set(["svg","g","path","ellipse","text","defs","marker","circle","line","rect"]);

  function wrap(nodes){
    return {
      _nodes: nodes,
      node(){ return this._nodes[0]; },
      empty(){ return this._nodes.length===0; },
      attr(name, value){
        this._nodes.forEach((n,i)=>{
          const v = typeof value === 'function' ? value.call(n, n.__data__, i) : value;
          if(v===null||v===undefined) n.removeAttribute(name); else n.setAttribute(name, v);
        });
        return this;
      },
      style(name, value){
        this._nodes.forEach((n,i)=>{
          const v = typeof value === 'function' ? value.call(n, n.__data__, i) : value;
          if(v===null||v===undefined) n.style.removeProperty(name); else n.style[name]=v;
        });
        return this;
      },
      text(value){
        this._nodes.forEach((n,i)=>{
          const v = typeof value === 'function'? value.call(n, n.__data__, i): value;
          n.textContent = v;
        });
        return this;
      },
      html(value){
        this._nodes.forEach(n=>{ n.innerHTML = value; });
        return this;
      },
      on(event, handler){
        this._nodes.forEach(n=>{ n.addEventListener(event, function(ev){ handler.call(n, ev); }); });
        return this;
      },
      classed(name, value){
        this._nodes.forEach((n,i)=>{
          const v = typeof value === 'function'? value.call(n, n.__data__, i): value;
          n.classList.toggle(name, !!v);
        });
        return this;
      },
      append(tag){
        const isSvg = SVG_TAGS.has(tag);
        const newNodes = this._nodes.map(n=>{
          const el = isSvg ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
          n.appendChild(el);
          return el;
        });
        return wrap(newNodes);
      },
      remove(){
        this._nodes.forEach(n=>{ if(n.parentNode) n.parentNode.removeChild(n); });
        return this;
      },
      selectAll(sel){
        const parent = this._nodes[0];
        const found = parent ? Array.from(parent.querySelectorAll(sel)) : [];
        const w = wrap(found);
        w._parent = parent;
        return w;
      },
      data(arr){ this._boundData = arr; return this; },
      enter(){
        const data = this._boundData || [];
        const parent = this._parent;
        return {
          append: (tag)=>{
            const isSvg = SVG_TAGS.has(tag);
            const created = data.map(d=>{
              const el = isSvg ? document.createElementNS(SVGNS, tag) : document.createElement(tag);
              el.__data__ = d;
              parent.appendChild(el);
              return el;
            });
            return wrap(created);
          }
        };
      }
    };
  }

  window.d3 = {
    select(sel){
      const n = typeof sel === 'string' ? document.querySelector(sel) : sel;
      return wrap(n ? [n] : []);
    },
    selectAll(sel){
      return wrap(Array.from(document.querySelectorAll(sel)));
    },
    scaleSqrt(){
      let domain=[0,1], range=[0,1];
      function scale(v){
        const d0=Math.sqrt(domain[0]), d1=Math.sqrt(domain[1]);
        const t = (Math.sqrt(v)-d0)/((d1-d0)||1);
        return range[0] + t*(range[1]-range[0]);
      }
      scale.domain = (d)=>{domain=d; return scale;};
      scale.range = (r)=>{range=r; return scale;};
      return scale;
    },
    max(arr){ return arr.reduce((a,b)=>Math.max(a,b), -Infinity); },
    pointer(ev, node){
      const rect = node.getBoundingClientRect();
      return [ev.clientX-rect.left, ev.clientY-rect.top];
    }
  };
})();

<script>
const MAP_W = 2022, MAP_H = 1414;
function fitMapStage(){
  const wrap = document.getElementById("mapWrap");
  const stage = document.getElementById("mapStage");
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const targetRatio = MAP_W / MAP_H;
  let w, h;
  if(cw/ch > targetRatio){ h = ch; w = ch*targetRatio; }
  else { w = cw; h = cw/targetRatio; }
  stage.style.width = w+"px";
  stage.style.height = h+"px";
  resetZoom();
}

// --- Map zoom / pan ---
const ZOOM_MIN = 1, ZOOM_MAX = 6;
let zoomScale = 1, zoomX = 0, zoomY = 0;

function applyZoomTransform(){
  const stage = document.getElementById("mapStage");
  stage.style.transform = `translate(${zoomX}px, ${zoomY}px) scale(${zoomScale})`;
}

function resetZoom(){
  zoomScale = 1; zoomX = 0; zoomY = 0;
  applyZoomTransform();
  updateZoomLabel();
}

function updateZoomLabel(){
  const btn = document.getElementById("zoomResetBtn");
  if(btn) btn.textContent = Math.round(zoomScale*100)+"%";
}

function zoomAt(clientX, clientY, factor){
  const wrap = document.getElementById("mapWrap");
  const stage = document.getElementById("mapStage");
  const wrapRect = wrap.getBoundingClientRect();
  const mouseX = clientX - wrapRect.left - stage.offsetLeft;
  const mouseY = clientY - wrapRect.top - stage.offsetTop;
  const newScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomScale*factor));
  const k = newScale/zoomScale;
  zoomX = mouseX - (mouseX - zoomX)*k;
  zoomY = mouseY - (mouseY - zoomY)*k;
  zoomScale = newScale;
  if(zoomScale===ZOOM_MIN){ zoomX = 0; zoomY = 0; }
  applyZoomTransform();
  updateZoomLabel();
}

function initZoomPan(){
  const wrap = document.getElementById("mapWrap");
  const stage = document.getElementById("mapStage");
  wrap.addEventListener("wheel", (ev)=>{
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.2 : 1/1.2;
    zoomAt(ev.clientX, ev.clientY, factor);
  }, {passive:false});

  let dragging=false, startX=0, startY=0, startZoomX=0, startZoomY=0, dragDist=0;
  stage.addEventListener("mousedown", (ev)=>{
    if(zoomScale<=ZOOM_MIN) return;
    dragging=true; dragDist=0; startX=ev.clientX; startY=ev.clientY; startZoomX=zoomX; startZoomY=zoomY;
    stage.classList.add("dragging");
    ev.preventDefault();
  });
  window.addEventListener("mousemove", (ev)=>{
    if(!dragging) return;
    zoomX = startZoomX + (ev.clientX-startX);
    zoomY = startZoomY + (ev.clientY-startY);
    dragDist = Math.max(dragDist, Math.abs(ev.clientX-startX)+Math.abs(ev.clientY-startY));
    applyZoomTransform();
  });
  window.addEventListener("mouseup", ()=>{
    if(dragging && dragDist>5){
      // suppress the click that follows a real drag so it doesn't also select whatever is underneath
      const suppress = (ev)=>{ ev.stopPropagation(); ev.preventDefault(); window.removeEventListener("click", suppress, true); };
      window.addEventListener("click", suppress, true);
    }
    dragging=false; stage.classList.remove("dragging");
  });

  document.getElementById("zoomInBtn").addEventListener("click", ()=>{
    const r = wrap.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, 1.4);
  });
  document.getElementById("zoomOutBtn").addEventListener("click", ()=>{
    const r = wrap.getBoundingClientRect();
    zoomAt(r.left+r.width/2, r.top+r.height/2, 1/1.4);
  });
  document.getElementById("zoomResetBtn").addEventListener("click", resetZoom);
}

function starPath(cx, cy, rOuter, rInner, points, rotationDeg){
  const step = Math.PI / points;
  const rot = (rotationDeg||-90) * Math.PI/180;
  let d = "";
  for(let i=0;i<points*2;i++){
    const r = i%2===0 ? rOuter : rInner;
    const angle = rot + i*step;
    const x = cx + r*Math.cos(angle), y = cy + r*Math.sin(angle);
    d += (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
  }
  return d + "Z";
}

function slug(s){ return s.toLowerCase().replace(/[^a-z]+/g,'-'); }

function arcPath(p0, p1, bend){
  const mx = (p0[0]+p1[0])/2, my = (p0[1]+p1[1])/2;
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  const nx = -dy, ny = dx;
  const len = Math.sqrt(nx*nx+ny*ny) || 1;
  const cx = mx + (nx/len)*bend, cy = my + (ny/len)*bend;
  return `M ${p0[0]} ${p0[1]} Q ${cx} ${cy} ${p1[0]} ${p1[1]}`;
}

// Smooth multi-point curve (chained quadratic Beziers through each interior via-point).
function smoothPath(pts){
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2;
    d += ` Q ${pts[i][0]} ${pts[i][1]} ${mx} ${my}`;
  }
  const c = pts[pts.length-2], last = pts[pts.length-1];
  d += ` Q ${c[0]} ${c[1]} ${last[0]} ${last[1]}`;
  return d;
}

function shrinkEndpoints(p0, p1, r0, r1){
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1];
  const len = Math.sqrt(dx*dx+dy*dy) || 1;
  const ux = dx/len, uy = dy/len;
  return [
    [p0[0]+ux*r0, p0[1]+uy*r0],
    [p1[0]-ux*r1, p1[1]-uy*r1]
  ];
}

let widthScale;
let arrowColors = {}, arrowMarkers = {};

function renderAll(){
  const rows = RAW.rows;
  const vals = rows.map(r=>Math.abs(getValue(r)));
  widthScale = d3.scaleSqrt().domain([0, d3.max(vals)]).range([3, 14]);

  gArrows.selectAll("*").remove();
  arrowColors = {}; arrowMarkers = {};

  rows.forEach((r,i)=>{
    const origFrom = r[0], origTo = r[1];
    let [from, to] = r;
    let val = getValue(r);
    if(val < 0){ [from, to] = [to, from]; val = -val; }
    const p0 = regionCentroids[from], p1 = regionCentroids[to];
    if(!p0 || !p1) return;
    const key = from+"->"+to;

    const fp = FLOW_PATHS[origFrom+"->"+origTo];
    let d, color = "#ffce54", markerId = "arrowhead-default";
    if(fp){
      const pts = (from===origFrom) ? fp.points : fp.points.slice().reverse();
      d = smoothPath(pts);
      color = fp.color; markerId = fp.markerId;
    } else {
      const bend = 70 * (( (from.length+to.length) % 3 ) - 1);
      const [a,b] = shrinkEndpoints(p0,p1, 90, 90);
      d = arcPath(a,b,bend);
    }
    arrowColors[i] = color; arrowMarkers[i] = markerId;
    const sw = widthScale(Math.abs(val));

    gArrows.append("path")
      .attr("class","flow-arrow-outline")
      .attr("data-idx", i)
      .attr("d", d)
      .attr("fill","none")
      .attr("stroke", "#1a1200")
      .attr("stroke-width", sw+6)
      .attr("stroke-opacity", 0.9)
      .attr("marker-end","url(#arrowhead-outline)");

    gArrows.append("path")
      .attr("class","flow-arrow")
      .attr("id","arrow-"+i)
      .attr("data-idx", i)
      .attr("d", d)
      .attr("fill","none")
      .attr("stroke", color)
      .attr("stroke-width", sw)
      .attr("stroke-opacity", 1)
      .attr("marker-end",`url(#${markerId})`);

    gArrows.append("path")
      .attr("class","flow-arrow-hit")
      .attr("d", d)
      .on("click", ()=>onFlowClick(key, from, to, val, i))
      .on("mousemove",(ev)=>showTip(ev, `<b>${from} → ${to}</b><br>${dateLabel()}<br>${fmt(Math.abs(val))} MMcf/d`))
      .on("mouseleave", hideTip);
  });

  buildFlowList();
  applyFilter();
  updateDetail();
}

function dateLabel(){
  return RAW.header[2+currentDateIdx];
}

function buildLegend(){
  const legend = d3.select("#legend");
  legend.selectAll("*").remove();
  Object.entries(REGION_COLORS).forEach(([name,color])=>{
    const item = legend.append("div").attr("class","legend-item").attr("id","legend-"+slug(name))
      .on("click", ()=>onRegionClick(name));
    item.append("div").attr("class","swatch").style("background", color);
    item.append("div").text(name);
  });
}

function buildFlowList(){
  const rows = RAW.rows.map((r,i)=>({r,i, val:getValue(r)}));
  rows.sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
  const list = d3.select("#flowList");
  list.selectAll("*").remove();
  rows.forEach(({r,i,val})=>{
    let [from,to] = r;
    let v = val;
    if(v<0){ [from,to]=[to,from]; v=-v; }
    const row = list.append("div").attr("class","flow-row").attr("data-idx", i)
      .on("click", ()=>onFlowClick(from+"->"+to, from, to, v, i))
      .on("mouseenter", function(){ d3.select("#arrow-"+i).attr("stroke","#ffffff"); })
      .on("mouseleave", function(){ if(selectedFlowKey !== (from+"->"+to)) d3.select("#arrow-"+i).attr("stroke", arrowColors[i] || "#ffce54"); });
    row.append("div").attr("class","route").text(`${from} → ${to}`);
    row.append("div").attr("class","val").text(fmt(v)+" MMcf/d");
  });
}

function onRegionClick(region){
  selectedRegion = (selectedRegion===region) ? null : region;
  selectedFlowKey = null;
  applyFilter();
  updateDetail();
}

function onFlowClick(key, from, to, val, i){
  selectedFlowKey = (selectedFlowKey===key) ? null : key;
  selectedRegion = null;
  applyFilter();
  updateDetail(from,to,val);
}

function applyFilter(){
  d3.selectAll(".legend-item").classed("selected", function(){
    return this.id === "legend-"+slug(selectedRegion||"");
  });
  d3.selectAll(".region-poly").classed("dim", function(){
    if(!selectedRegion) return false;
    return this.id !== "region-"+slug(selectedRegion);
  });
  const isDimmed = function(){
    const idx = this.getAttribute("data-idx");
    const row = RAW.rows[idx];
    let [from,to] = row;
    if(selectedRegion){
      return from!==selectedRegion && to!==selectedRegion;
    }
    return false;
  };
  d3.selectAll(".flow-arrow-outline").classed("dim", isDimmed);
  d3.selectAll(".flow-arrow").classed("dim", isDimmed).attr("stroke", function(){
    const idx = this.getAttribute("data-idx");
    const row = RAW.rows[idx];
    let [from,to] = row, val = getValue(row);
    if(val<0)[from,to]=[to,from];
    const key = from+"->"+to;
    return (selectedFlowKey===key) ? "#ffffff" : (arrowColors[idx] || "#ffce54");
  });
  d3.selectAll(".flow-row").style("outline", function(){
    return null;
  }).style("background", function(){
    const idx = +this.getAttribute("data-idx");
    const row = RAW.rows[idx];
    let [from,to] = row, val = getValue(row);
    if(val<0)[from,to]=[to,from];
    const key = from+"->"+to;
    return selectedFlowKey===key ? "#22314a" : null;
  });
}

function updateDetail(from,to,val){
  const detail = d3.select("#detail");
  if(selectedFlowKey && from){
    detail.html(`
      <b>${from} → ${to}</b><br>
      기준일: ${dateLabel()}<br>
      Flow: <b>${fmt(Math.abs(val))} MMcf/d</b><br><br>
      ${history(from,to)}
    `);
  } else if(selectedRegion){
    const rows = RAW.rows;
    let inflow=0, outflow=0, lines=[];
    rows.forEach(r=>{
      let [f,t] = r; let v = getValue(r);
      if(v<0){ [f,t]=[t,f]; v=-v; }
      if(f===selectedRegion){ outflow+=v; lines.push(`→ ${t}: ${fmt(v)}`); }
      if(t===selectedRegion){ inflow+=v; lines.push(`← ${f}: ${fmt(v)}`); }
    });
    detail.html(`
      <b>${selectedRegion}</b> (${dateLabel()})<br>
      유입 합계: <b>${fmt(inflow)}</b> MMcf/d<br>
      유출 합계: <b>${fmt(outflow)}</b> MMcf/d<br>
      순 유입: <b>${fmt(inflow-outflow)}</b> MMcf/d<br><br>
      ${lines.map(l=>`<div>${l}</div>`).join("")}
    `);
  } else {
    detail.html("지역 또는 화살표를 클릭하면 상세 정보가 표시됩니다.");
  }
}

function history(from,to){
  const row = RAW.rows.find(r=>(r[0]===from&&r[1]===to)||(r[0]===to&&r[1]===from));
  if(!row) return "";
  const header = RAW.header.slice(2);
  const vals = row.slice(2);
  const items = header.map((h,i)=>{
    let v = vals[i];
    let dir = (row[0]===from) ? v : -v;
    return `<div style="display:flex;justify-content:space-between;"><span>${h}</span><span>${fmt(Math.abs(dir))} (${dir>=0? row[0]+"→"+row[1] : row[1]+"→"+row[0]})</span></div>`;
  });
  return `<div style="max-height:160px;overflow-y:auto;border-top:1px solid #2a3242;padding-top:6px;">${items.join("")}</div>`;
}

function showTip(ev, html){
  const [x,y] = d3.pointer(ev, document.getElementById("mapWrap"));
  tooltip.style("display","block").html(html)
    .style("left", (x+16)+"px")
    .style("top", (y+10)+"px");
}
function hideTip(){ tooltip.style("display","none"); }

d3.select("#resetBtn").on("click", ()=>{
  selectedRegion=null; selectedFlowKey=null; applyFilter(); updateDetail();
});

d3.select("#bgOpacity").on("input", function(){
  d3.select("#bgimg").style("opacity", (+this.value/100));
});

window.addEventListener("resize", fitMapStage);

fitMapStage();
initZoomPan();
try {
  RAW = FLOW_DATA;
  buildDateSelector(FLOW_DATA.header);
  buildMap();
  buildPlays();
  buildLegend();
  renderAll();
} catch(err){
  console.error(err);
  document.getElementById("mapWrap").insertAdjacentHTML("beforeend",
    `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;color:#f0c777;font-size:14px;background:rgba(5,8,13,.9);z-index:30;">
      대시보드 초기화 중 오류가 발생했습니다.<br>${(err && err.message) || err}
     </div>`);
}
</script>
</body>
</html>
